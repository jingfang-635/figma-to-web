server:
  port: ${API_PORT:8080}

spring:
  application:
    name: yiliao
  datasource:
    url: ${MYSQL_JDBC_URL:${MYSQL_URL:}}
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Reads env JWT_SECRET; empty means auth token issuance is blocked at runtime
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    admin-username: admin
    admin-password: ${GATE_PASS:}

logging:
  level:
    org.hibernate.SQL: warn
